<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake Costing — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f9;
    --panel:#ffffff;
    --ink:#32334a;
    --ink-soft:#5a5b78;
    --muted:#a5a3b8;
    --line:#eceaf5;
    --accent:#7367f0;          /* Sneat violet */
    --accent-soft:#eeecff;
    --accent-dark:#5a4fd6;
    --success:#28c76f;
    --success-soft:#dff7e9;
    --warn:#ff9f43;
    --warn-soft:#fff1e0;
    --danger:#ea5455;
    --danger-soft:#fde3e4;
    --info:#00cfe8;
    --info-soft:#d9f6fa;
    --card1:#7367f0;   /* violet */
    --card2:#00cfe8;   /* cyan */
    --card3:#ff9f43;   /* orange */
    --card4:#28c76f;   /* green */
    --font: 'Public Sans','Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius:10px;
    --radius-lg:14px;
    --shadow:0 2px 8px rgba(50,51,74,0.06);
    --shadow-lg:0 6px 20px rgba(50,51,74,0.08);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* -------- Layout -------- */
  .app{ display:grid; grid-template-columns:260px 1fr; min-height:100vh; }

  /* -------- Sidebar -------- */
  aside{
    background:var(--panel); border-right:1px solid var(--line);
    padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    display:flex; align-items:center; gap:10px; padding:0 10px 22px; margin-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .brand-logo{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg,var(--accent),#9d94f5);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;
    box-shadow:0 4px 10px rgba(115,103,240,0.35);
  }
  .brand-name{ font-weight:700; font-size:18px; letter-spacing:-0.2px; }
  .brand-name span{ color:var(--accent); }
  .nav-section{
    font-size:10.5px; font-weight:600; color:var(--muted); text-transform:uppercase;
    letter-spacing:0.6px; padding:14px 12px 6px;
  }
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:8px;
    color:var(--ink-soft); cursor:pointer; font-weight:500; font-size:13.5px;
    margin-bottom:2px; transition:background 0.15s;
    border:none; background:none; width:100%; text-align:left; font-family:inherit;
  }
  .nav-item:hover{ background:#f6f5fa; color:var(--ink); }
  .nav-item.active{
    background:linear-gradient(72deg,var(--accent) 0%, #8f83f5 100%);
    color:#fff; box-shadow:0 3px 10px rgba(115,103,240,0.35);
  }
  .nav-item.active .icn{ color:#fff; }
  .icn{ width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0; }
  .nav-item.active .icn svg{ stroke:#fff; }
  .badge{
    margin-left:auto; font-size:10px; padding:2px 7px; border-radius:10px;
    background:var(--danger); color:#fff; font-weight:600;
  }
  .badge.soft{ background:var(--accent-soft); color:var(--accent); }

  /* -------- Topbar -------- */
  main{ padding:0; }
  .topbar{
    background:var(--panel); border-radius:var(--radius-lg); margin:18px 28px 0;
    padding:10px 18px; display:flex; align-items:center; gap:14px;
    box-shadow:var(--shadow);
  }
  .search{
    display:flex; align-items:center; gap:8px; flex:1; color:var(--muted);
  }
  .search input{
    border:none; outline:none; background:none; font-family:inherit; font-size:14px;
    color:var(--ink); width:100%;
  }
  .top-icons{ display:flex; align-items:center; gap:6px; }
  .top-icons .icn-btn{
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    border-radius:8px; color:var(--ink-soft); cursor:pointer; position:relative;
  }
  .top-icons .icn-btn:hover{ background:#f6f5fa; }
  .top-icons .dot{
    position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:50%;
    background:var(--danger); border:2px solid #fff;
  }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg,#ffb6c1,#ff9f43); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
    border:2px solid #fff; box-shadow:0 0 0 2px var(--success);
    margin-left:6px;
  }

  /* -------- Content -------- */
  .content{ padding:22px 28px 60px; }

  /* Greeting card */
  .hero{
    background:var(--panel); border-radius:var(--radius-lg); padding:22px 26px;
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:20px;
    margin-bottom:20px; box-shadow:var(--shadow); overflow:hidden; position:relative;
  }
  .hero h2{
    margin:0 0 6px; font-size:20px; font-weight:600; color:var(--accent);
  }
  .hero p{ margin:0; color:var(--ink-soft); font-size:13.5px; max-width:520px; }
  .hero-stats{ display:flex; gap:26px; margin-top:14px; }
  .hero-stat .l{ font-size:12px; color:var(--muted); }
  .hero-stat .v{ font-size:20px; font-weight:700; color:var(--ink); margin-top:2px; }
  .hero-illus{
    width:180px; height:120px; position:relative;
    display:flex; align-items:flex-end; justify-content:center;
  }
  /* CSS-only cake illustration */
  .cake{ position:relative; width:130px; height:110px; }
  .cake .plate{
    position:absolute; bottom:0; left:-5px; width:140px; height:12px; border-radius:50%;
    background:linear-gradient(180deg,#e8e6f4,#c8c5db);
  }
  .cake .layer{
    position:absolute; left:14px; width:100px; height:26px; border-radius:6px;
  }
  .cake .l1{ bottom:8px; background:linear-gradient(180deg,#c9a876,#a8875a); }
  .cake .l2{ bottom:32px; background:linear-gradient(180deg,#f4c4d1,#e89aab); width:96px; left:16px; }
  .cake .l3{ bottom:56px; background:linear-gradient(180deg,#fff,#f0eaff); width:88px; left:20px; }
  .cake .cherry{
    position:absolute; bottom:80px; left:58px; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#ff8080,#c93030);
  }
  .cake .candle{
    position:absolute; bottom:82px; left:64px; width:4px; height:20px; background:#7367f0; border-radius:2px;
  }
  .cake .flame{
    position:absolute; bottom:100px; left:62px; width:8px; height:12px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, #ffdb70, #ff8c1a);
  }

  /* Stat cards */
  .stat-row{
    display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:20px;
  }
  .stat-card{
    background:var(--panel); border-radius:var(--radius-lg); padding:18px 20px;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .stat-card .icn-bg{
    width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    margin-bottom:12px;
  }
  .stat-card .lbl{ font-size:13px; color:var(--ink-soft); font-weight:500; }
  .stat-card .val{ font-size:24px; font-weight:700; margin-top:4px; letter-spacing:-0.3px; }
  .stat-card .delta{ font-size:12px; color:var(--success); font-weight:600; margin-top:4px; }
  .stat-card .delta.dn{ color:var(--danger); }
  .stat-1 .icn-bg{ background:var(--accent-soft); color:var(--accent); }
  .stat-2 .icn-bg{ background:var(--info-soft); color:var(--info); }
  .stat-3 .icn-bg{ background:var(--warn-soft); color:var(--warn); }
  .stat-4 .icn-bg{ background:var(--success-soft); color:var(--success); }

  /* Cards / panels */
  .panel{
    background:var(--panel); border-radius:var(--radius-lg); padding:22px 24px;
    box-shadow:var(--shadow); margin-bottom:20px;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap;
  }
  .panel h3{ margin:0; font-size:16px; font-weight:600; letter-spacing:-0.2px; }
  .panel .sub{ margin:2px 0 0; color:var(--muted); font-size:12.5px; }

  /* Tables */
  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:11px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.4px; padding:10px 12px;
    border-bottom:1px solid var(--line); background:#fafaff;
  }
  th:first-child{ border-top-left-radius:8px; }
  th:last-child{ border-top-right-radius:8px; }
  td{ padding:12px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:#fafaff; }
  .num{ text-align:right; font-variant-numeric:tabular-nums; font-weight:500; }

  /* Inputs */
  input, select{
    font-family:inherit; font-size:13.5px; padding:9px 12px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--ink); width:100%; transition:border 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(115,103,240,0.12);
  }
  .row-add{
    display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:flex-end;
    padding-top:16px; border-top:1px dashed var(--line);
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{
    font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;
  }

  /* Buttons */
  button.primary{
    background:var(--accent); color:#fff; border:none; padding:9px 18px; border-radius:8px;
    cursor:pointer; font-size:13.5px; font-weight:600; font-family:inherit;
    box-shadow:0 3px 8px rgba(115,103,240,0.28); transition:background 0.15s, transform 0.05s;
  }
  button.primary:hover{ background:var(--accent-dark); }
  button.primary:active{ transform:translateY(1px); }
  button.ghost{
    background:none; border:1px solid var(--line); color:var(--ink-soft); padding:6px 12px;
    border-radius:6px; cursor:pointer; font-size:12px; font-weight:500; font-family:inherit;
  }
  button.ghost:hover{ border-color:var(--danger); color:var(--danger); background:var(--danger-soft); }

  /* Pills */
  .pill{
    display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600;
  }
  .pill.ok{ background:var(--success-soft); color:var(--success); }
  .pill.low{ background:var(--warn-soft); color:var(--warn); }
  .pill.bridge{ background:var(--accent-soft); color:var(--accent); }
  .pill.err{ background:var(--danger-soft); color:var(--danger); }

  .empty{ color:var(--muted); font-style:italic; padding:24px 4px; text-align:center; }

  /* BOM lines */
  .bom-line{
    display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:12px; align-items:center;
    padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px;
    background:#fff;
  }
  .bom-line:hover{ border-color:var(--accent-soft); background:#fafaff; }

  /* Recipe select styled */
  .recipe-select{ margin-bottom:18px; max-width:360px; }

  /* Info box */
  .conv-box{
    background:linear-gradient(135deg,#f4f2ff,#eeecff);
    border:1px solid #dedafc; border-radius:10px; padding:14px 16px;
    font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;
  }
  .conv-box b{ color:var(--accent-dark); }

  /* Stats row inside costing page */
  .metric-row{
    display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:20px;
  }
  .metric{
    background:linear-gradient(135deg,#fff,#fafaff);
    border:1px solid var(--line); border-radius:10px; padding:16px 18px;
  }
  .metric .l{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }
  .metric .v{ font-size:22px; font-weight:700; margin-top:6px; letter-spacing:-0.3px; }
  .metric.accent{ background:linear-gradient(135deg,var(--accent),#8f83f5); border:none; }
  .metric.accent .l, .metric.accent .v{ color:#fff; }

  /* Responsive */
  @media(max-width:960px){
    .app{ grid-template-columns:1fr; }
    aside{ display:none; }
    .stat-row{ grid-template-columns:repeat(2,1fr); }
    .hero{ grid-template-columns:1fr; }
    .hero-illus{ display:none; }
    .metric-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand">
      <div class="brand-logo">🍰</div>
      <div class="brand-name">Sweet<span>Cost</span></div>
    </div>
    <div class="nav-section">Main</div>
    <div id="nav"></div>
    <div class="nav-section">Data</div>
    <button class="nav-item"><span class="icn">📥</span> Import CSV</button>
    <button class="nav-item"><span class="icn">📤</span> Export</button>
    <div class="nav-section">Support</div>
    <button class="nav-item"><span class="icn">❓</span> Help</button>
    <button class="nav-item"><span class="icn">⚙️</span> Settings</button>
  </aside>

  <main>
    <div class="topbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input placeholder="Search recipes, ingredients…">
      </div>
      <div class="top-icons">
        <div class="icn-btn" title="Currency">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <div class="icn-btn" title="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="dot"></span>
        </div>
        <div class="avatar">A</div>
      </div>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* ============== ICON HELPERS ============== */
const ICONS = {
  ingredients: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
  recipes: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>',
  bom: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',
  costing: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  pricing: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  inventory: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>',
  reports: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 5-9"/></svg>',
};

/* ============== STORAGE ============== */
const mem = {};
const store = {
  async get(k){ if(window.storage){ try{ const r = await window.storage.get(k,false); return r?r.value:null; }catch(e){ return null; } } return mem[k] ?? null; },
  async set(k,v){ if(window.storage){ try{ await window.storage.set(k,v,false); return; }catch(e){} } mem[k]=v; }
};

/* ============== UNITS ============== */
const UNITS = {
  g:{dim:'mass',toBase:1,label:'g'}, kg:{dim:'mass',toBase:1000,label:'kg'},
  oz:{dim:'mass',toBase:28.3495,label:'oz'}, lb:{dim:'mass',toBase:453.592,label:'lb'},
  ml:{dim:'volume',toBase:1,label:'ml'}, l:{dim:'volume',toBase:1000,label:'L'},
  tsp:{dim:'volume',toBase:4.92892,label:'tsp'}, tbsp:{dim:'volume',toBase:14.7868,label:'tbsp'},
  cup:{dim:'volume',toBase:236.588,label:'cup'}, pcs:{dim:'count',toBase:1,label:'pcs'},
};
function convert(qty,from,to,density){
  const f=UNITS[from], t=UNITS[to]; if(!f||!t) return {ok:false};
  if(f.dim===t.dim) return {ok:true, value:qty*f.toBase/t.toBase, bridged:false};
  const mv = (f.dim==='mass'&&t.dim==='volume')||(f.dim==='volume'&&t.dim==='mass');
  if(mv && density){
    let g = f.dim==='mass' ? qty*f.toBase : qty*f.toBase*density;
    if(t.dim==='mass') return {ok:true, value:g/t.toBase, bridged:true};
    return {ok:true, value:(g/density)/t.toBase, bridged:true};
  }
  return {ok:false, reason:'needs density'};
}

/* ============== SEED ============== */
let ingredients = [
  {id:'i1', name:'Cake Flour',       purchaseUnit:'kg', purchaseQty:12.5, purchasePrice:68.00, wastePct:2, density:0.53},
  {id:'i2', name:'Caster Sugar',     purchaseUnit:'kg', purchaseQty:25,   purchasePrice:70.00, wastePct:0, density:0.85},
  {id:'i3', name:'Unsalted Butter',  purchaseUnit:'kg', purchaseQty:5,    purchasePrice:95.00, wastePct:1, density:0.96},
  {id:'i4', name:'Eggs (large)',     purchaseUnit:'pcs',purchaseQty:30,   purchasePrice:21.00, wastePct:5, density:null},
  {id:'i5', name:'Fresh Milk',       purchaseUnit:'l',  purchaseQty:10,   purchasePrice:52.00, wastePct:0, density:1.03},
  {id:'i6', name:'Vanilla Extract',  purchaseUnit:'ml', purchaseQty:500,  purchasePrice:38.00, wastePct:0, density:0.88},
  {id:'i7', name:'Baking Powder',    purchaseUnit:'g',  purchaseQty:1000, purchasePrice:14.00, wastePct:0, density:0.9},
];
let recipes = [
  {id:'r1', name:'Classic Vanilla Sponge (8" round)', category:'Cake', yieldPortions:12, targetFoodCostPct:28},
];
let bom = {
  r1:[
    {ingredientId:'i1',qty:320,unit:'g'},
    {ingredientId:'i2',qty:280,unit:'g'},
    {ingredientId:'i3',qty:1,unit:'cup'},
    {ingredientId:'i4',qty:4,unit:'pcs'},
    {ingredientId:'i5',qty:120,unit:'ml'},
    {ingredientId:'i6',qty:2,unit:'tsp'},
    {ingredientId:'i7',qty:8,unit:'g'},
  ]
};
let inventory = {};

async function loadAll(){
  const s = await store.get('cake-rc-data');
  if(s){ try{ const d=JSON.parse(s); ingredients=d.ingredients??ingredients; recipes=d.recipes??recipes; bom=d.bom??bom; inventory=d.inventory??inventory; }catch(e){} }
  else { ingredients.forEach(i=> inventory[i.id]=inventory[i.id]??Math.round(i.purchaseQty*0.6*10)/10); }
}
async function saveAll(){ await store.set('cake-rc-data', JSON.stringify({ingredients,recipes,bom,inventory})); }

/* ============== CALC ============== */
const findIng = id => ingredients.find(i=>i.id===id);
function unitCostBase(ing){
  const u=UNITS[ing.purchaseUnit]; if(!u) return 0;
  const q = ing.purchaseQty*u.toBase*(1-(ing.wastePct||0)/100);
  return q>0 ? ing.purchasePrice/q : 0;
}
function lineCost(ing,qty,unit){
  const pu=UNITS[ing.purchaseUnit], uu=UNITS[unit]; if(!pu||!uu) return {ok:false,reason:'unknown unit'};
  const base=unitCostBase(ing);
  if(pu.dim===uu.dim) return {ok:true, cost:qty*uu.toBase*base, bridged:false};
  const c=convert(qty,unit,ing.purchaseUnit,ing.density);
  if(!c.ok) return {ok:false, reason:c.reason||'no conversion'};
  return {ok:true, cost:c.value*pu.toBase*base, bridged:c.bridged};
}
function recipeCostTotal(rid){
  return (bom[rid]||[]).reduce((s,l)=>{ const i=findIng(l.ingredientId); if(!i) return s; const r=lineCost(i,l.qty,l.unit); return s+(r.ok?r.cost:0); },0);
}
function costPerPortion(r){ const t=recipeCostTotal(r.id); return r.yieldPortions>0?t/r.yieldPortions:0; }
function suggestedPrice(r){ const cpp=costPerPortion(r); const p=(r.targetFoodCostPct||28)/100; return p>0?cpp/p:0; }
const money = n => 'RM ' + (isFinite(n)?n:0).toFixed(2);
const uid = p => p + Math.random().toString(36).slice(2,8);

/* ============== TABS ============== */
const TABS = [
  {id:'dashboard',   label:'Dashboard',     icon:ICONS.reports},
  {id:'ingredients', label:'Ingredients',   icon:ICONS.ingredients},
  {id:'recipes',     label:'Recipes',       icon:ICONS.recipes},
  {id:'bomtab',      label:'Recipe BOM',    icon:ICONS.bom},
  {id:'costing',     label:'Yield & Cost',  icon:ICONS.costing},
  {id:'pricing',     label:'Pricing',       icon:ICONS.pricing},
  {id:'inventory',   label:'Inventory',     icon:ICONS.inventory},
];
let activeTab = 'dashboard';

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map(t=>
    `<button class="nav-item ${t.id===activeTab?'active':''}" data-tab="${t.id}">
       <span class="icn">${t.icon}</span> ${t.label}
     </button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b=>{ b.onclick=()=>{ activeTab=b.dataset.tab; render(); }; });
}

/* ============== RENDER ============== */
function render(){
  renderNav();
  const c = document.getElementById('content');
  c.innerHTML='';
  ({
    dashboard: renderDashboard,
    ingredients: renderIngredients,
    recipes: renderRecipes,
    bomtab: renderBom,
    costing: renderCosting,
    pricing: renderPricing,
    inventory: renderInventory,
  })[activeTab](c);
}

function unitOptions(sel){
  return Object.keys(UNITS).map(u=>`<option value="${u}" ${u===sel?'selected':''}>${UNITS[u].label}</option>`).join('');
}

    const sp=suggestedPrice(r), cpp=costPerPortion(r);

  },0)/recipes.length : 0;

  c.innerHTML = `
    <div class="hero">

        <p>Here's a snapshot of your bakery costing. Ingredient prices ripple through recipes and suggested prices automatically.</p>
        <div class="hero-stats">
          <div class="hero-stat"><div class="l">Recipes tracked</div><div class="v">${totalRec}</div></div>
          <div class="hero-stat"><div class="l">Ingredients on file</div><div class="v">${totalIng}</div></div>
          <div class="hero-stat"><div class="l">Avg. margin</div><div class="v">${avgMargin.toFixed(1)}%</div></div>
        </div>
      </div>
      <div class="hero-illus">
        <div class="cake">
          <div class="flame"></div><div class="candle"></div>
          <div class="cherry"></div>
          <div class="layer l3"></div><div class="layer l2"></div><div class="layer l1"></div>
          <div class="plate"></div>
        </div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card stat-1">
        <div class="icn-bg">${ICONS.recipes}</div>
        <div class="lbl">Total Recipes</div>
        <div class="val">${totalRec}</div>
        <div class="delta">↑ Active</div>
      </div>
      <div class="stat-card stat-2">
        <div class="icn-bg">${ICONS.ingredients}</div>
        <div class="lbl">Ingredients</div>
        <div class="val">${totalIng}</div>
        <div class="delta">↑ In master</div>
      </div>
      <div class="stat-card stat-3">
        <div class="icn-bg">${ICONS.costing}</div>
        <div class="lbl">Avg Cost / Portion</div>
        <div class="val">${money(avgCpp)}</div>
        <div class="delta">across all recipes</div>
      </div>
      <div class="stat-card stat-4">
        <div class="icn-bg">${ICONS.pricing}</div>
        <div class="lbl">Avg Margin</div>
        <div class="val">${avgMargin.toFixed(1)}%</div>
        <div class="delta">healthy</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><h3>Recipe Costing Overview</h3><p class="sub">Cost per portion vs suggested selling price</p></div>
        <button class="ghost" id="go-recipes">Manage recipes →</button>
      </div>
      <table>
        <thead><tr><th>Recipe</th><th>Category</th><th class="num">Cost/Portion</th><th class="num">Suggested Price</th><th class="num">Margin</th></tr></thead>
        <tbody>
          ${recipes.map(r=>{
            const cpp=costPerPortion(r), sp=suggestedPrice(r);
            const m = sp>0?((sp-cpp)/sp*100):0;
            return `<tr>
              <td><strong>${r.name}</strong></td>
              <td><span class="pill bridge">${r.category||'—'}</span></td>
              <td class="num">${money(cpp)}</td>
              <td class="num">${money(sp)}</td>
              <td class="num"><span class="pill ok">${m.toFixed(1)}%</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('go-recipes').onclick = ()=>{ activeTab='recipes'; render(); };
}

/* ---- INGREDIENTS ---- */
function renderIngredients(c){
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Ingredient Master</h3><p class="sub">Bulk purchase in → unit cost auto-calculated. Set density (g/ml) to enable cross-unit conversions.</p></div>
      </div>
      <table>
        <thead><tr><th>Ingredient</th><th>Unit</th><th class="num">Qty</th><th class="num">Price (RM)</th>
          <th class="num">Waste %</th><th class="num">Density</th><th class="num">Cost / base</th><th></th></tr></thead>
        <tbody id="ing-body"></tbody>
      </table>
      <div class="row-add">
        <div class="field"><label>Name</label><input id="ni-name" placeholder="e.g. Cocoa Powder" style="width:200px"></div>
        <div class="field"><label>Unit</label><select id="ni-unit" style="width:90px">${unitOptions('g')}</select></div>
        <div class="field"><label>Qty</label><input id="ni-qty" type="number" step="0.01" style="width:100px"></div>
        <div class="field"><label>Price</label><input id="ni-price" type="number" step="0.01" style="width:110px"></div>
        <div class="field"><label>Waste %</label><input id="ni-waste" type="number" value="0" style="width:90px"></div>
        <div class="field"><label>Density g/ml</label><input id="ni-density" type="number" step="0.01" style="width:110px" placeholder="opt."></div>
        <button class="primary" id="add-ing">+ Add Ingredient</button>
      </div>
    </div>
  `;
  const body = document.getElementById('ing-body');
  if(!ingredients.length){ body.innerHTML = `<tr><td colspan="8" class="empty">No ingredients yet.</td></tr>`; }
  ingredients.forEach(i=>{
    const dim = UNITS[i.purchaseUnit].dim;
    const bl = dim==='mass'?'g':dim==='volume'?'ml':'pcs';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${i.name}</strong></td>
      <td>${UNITS[i.purchaseUnit].label}</td>
      <td class="num">${i.purchaseQty}</td>
      <td class="num">${i.purchasePrice.toFixed(2)}</td>
      <td class="num">${i.wastePct||0}%</td>
      <td class="num">${i.density??'—'}</td>
      <td class="num"><strong>${money(unitCostBase(i))}</strong>/${bl}</td>
      <td><button class="ghost" data-del="${i.id}">Remove</button></td>
    `;
    body.appendChild(tr);
  });
  body.querySelectorAll('[data-del]').forEach(b=> b.onclick = async()=>{
    ingredients = ingredients.filter(i=>i.id!==b.dataset.del); await saveAll(); render();
  });
  document.getElementById('add-ing').onclick = async ()=>{
    const g = id => document.getElementById(id).value;
    const name=g('ni-name').trim(), unit=g('ni-unit'), qty=parseFloat(g('ni-qty')), price=parseFloat(g('ni-price'));
    const waste=parseFloat(g('ni-waste'))||0, density=parseFloat(g('ni-density'))||null;
    if(!name||!qty||!price){ alert('Name, qty and price required.'); return; }
    ingredients.push({id:uid('i'),name,purchaseUnit:unit,purchaseQty:qty,purchasePrice:price,wastePct:waste,density});
    await saveAll(); render();
  };
}

/* ---- RECIPES ---- */
function renderRecipes(c){
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Recipe Master</h3><p class="sub">Cakes and bakes with yield (portions per batch) and target food-cost %.</p></div>
      </div>
      <table>
        <thead><tr><th>Recipe</th><th>Category</th><th class="num">Yield</th><th class="num">Target FC%</th><th></th></tr></thead>
        <tbody id="rec-body"></tbody>
      </table>
      <div class="row-add">
        <div class="field"><label>Name</label><input id="nr-name" placeholder="e.g. Chocolate Fudge Cake" style="width:240px"></div>
        <div class="field"><label>Category</label><input id="nr-cat" placeholder="Cake / Cupcake" style="width:150px"></div>
        <div class="field"><label>Yield</label><input id="nr-yield" type="number" style="width:100px"></div>
        <div class="field"><label>Target FC %</label><input id="nr-fc" type="number" value="28" style="width:110px"></div>
        <button class="primary" id="add-rec">+ Add Recipe</button>
      </div>
    </div>
  `;
  const body = document.getElementById('rec-body');
  if(!recipes.length){ body.innerHTML = `<tr><td colspan="5" class="empty">No recipes yet.</td></tr>`; }
  recipes.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><strong>${r.name}</strong></td>
      <td><span class="pill bridge">${r.category||'—'}</span></td>
      <td class="num">${r.yieldPortions}</td>
      <td class="num">${r.targetFoodCostPct}%</td>
      <td><button class="ghost" data-del="${r.id}">Remove</button></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('[data-del]').forEach(b=> b.onclick=async()=>{
    recipes=recipes.filter(r=>r.id!==b.dataset.del); delete bom[b.dataset.del]; await saveAll(); render();
  });
  document.getElementById('add-rec').onclick = async ()=>{
    const g=id=>document.getElementById(id).value;
    const name=g('nr-name').trim(), cat=g('nr-cat').trim(), y=parseInt(g('nr-yield')), fc=parseFloat(g('nr-fc'))||28;
    if(!name||!y){ alert('Name and yield required.'); return; }
    const id=uid('r'); recipes.push({id,name,category:cat,yieldPortions:y,targetFoodCostPct:fc}); bom[id]=[];
    await saveAll(); render();
  };
}

/* ---- BOM ---- */
let bomActive=null;
function renderBom(c){
  if(!recipes.length){ c.innerHTML=`<div class="panel"><p class="empty">Add a recipe first in Recipe Master.</p></div>`; return; }
  if(!bomActive||!recipes.find(r=>r.id===bomActive)) bomActive=recipes[0].id;

  c.innerHTML = `
    <div class="recipe-select">
      <select id="rp">${recipes.map(r=>`<option value="${r.id}" ${r.id===bomActive?'selected':''}>${r.name}</option>`).join('')}</select>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h3>Recipe BOM</h3><p class="sub">Use whatever unit the recipe is written in — conversion happens against the ingredient's purchase unit.</p></div>
      </div>
      <div class="conv-box">
        <b>Conversion rules:</b> g ↔ kg, oz ↔ lb, ml ↔ L ↔ tsp/tbsp/cup convert exactly.
        Crossing mass ↔ volume (e.g. <b>cups of butter</b> against a <b>kg</b> purchase) uses each ingredient's density.
        Missing density is flagged, not silently guessed.
      </div>
      <div id="bom-lines"></div>
      <div class="bom-line" style="margin-top:14px; background:#fafaff; border-style:dashed;">
        <select id="bi"></select>
        <input id="bq" type="number" step="0.01" placeholder="qty">
        <select id="bu">${unitOptions('g')}</select>
        <div></div>
        <button class="primary" id="ba">+ Add</button>
      </div>
    </div>
  `;
  document.getElementById('rp').onchange = e=>{ bomActive=e.target.value; render(); };
  const lines = bom[bomActive] || (bom[bomActive]=[]);
  const wrap = document.getElementById('bom-lines');
  if(!lines.length){ wrap.innerHTML = `<p class="empty">No ingredients linked yet.</p>`; }
  lines.forEach((l,idx)=>{
    const ing = findIng(l.ingredientId);
    const d = document.createElement('div'); d.className='bom-line';
    if(!ing){ d.innerHTML = `<div>(deleted)</div><div></div><div></div><div></div><button class="ghost" data-idx="${idx}">Remove</button>`; }
    else {
      const r = lineCost(ing,l.qty,l.unit);
      const badge = !r.ok?`<span class="pill err">no conversion</span>`
        : r.bridged?`<span class="pill bridge">via density</span>`
        : `<span class="pill ok">direct</span>`;
      d.innerHTML = `
        <div><strong>${ing.name}</strong></div>
        <div class="num">${l.qty} ${UNITS[l.unit].label}</div>
        <div>${badge}</div>
        <div class="num"><strong>${r.ok?money(r.cost):'—'}</strong></div>
        <button class="ghost" data-idx="${idx}">Remove</button>
      `;
    }
    wrap.appendChild(d);
  });
  wrap.querySelectorAll('[data-idx]').forEach(b=> b.onclick=async()=>{
    lines.splice(parseInt(b.dataset.idx),1); await saveAll(); render();
  });
  const sel = document.getElementById('bi');
  sel.innerHTML = ingredients.map(i=>`<option value="${i.id}">${i.name}</option>`).join('');
  document.getElementById('ba').onclick = async()=>{
    const iid=sel.value, q=parseFloat(document.getElementById('bq').value), u=document.getElementById('bu').value;
    if(!iid||!q){ alert('Pick ingredient and enter qty.'); return; }
    lines.push({ingredientId:iid,qty:q,unit:u}); await saveAll(); render();
  };
}

/* ---- COSTING ---- */
let costActive=null;
function renderCosting(c){
  if(!recipes.length){ c.innerHTML=`<div class="panel"><p class="empty">Add a recipe first.</p></div>`; return; }
  if(!costActive||!recipes.find(r=>r.id===costActive)) costActive=recipes[0].id;
  const r = recipes.find(x=>x.id===costActive);
  const lines = bom[r.id]||[];
  const total = recipeCostTotal(r.id);
  const cpp = costPerPortion(r);
  const sp = suggestedPrice(r);

  c.innerHTML = `
    <div class="recipe-select">
      <select id="rp">${recipes.map(x=>`<option value="${x.id}" ${x.id===costActive?'selected':''}>${x.name}</option>`).join('')}</select>
    </div>
    <div class="metric-row">
      <div class="metric"><div class="l">Total Batch Cost</div><div class="v">${money(total)}</div></div>
      <div class="metric"><div class="l">Portions per Batch</div><div class="v">${r.yieldPortions}</div></div>
      <div class="metric accent"><div class="l">Cost per Portion</div><div class="v">${money(cpp)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h3>Cost breakdown</h3><p class="sub">${r.name} — suggested price ${money(sp)} at ${r.targetFoodCostPct}% target</p></div>
      </div>
      <table>
        <thead><tr><th>Ingredient</th><th class="num">Qty used</th><th>Conversion</th><th class="num">Line cost</th></tr></thead>
        <tbody id="cb"></tbody>
      </table>
    </div>
  `;
  document.getElementById('rp').onchange = e=>{ costActive=e.target.value; render(); };
  const body = document.getElementById('cb');
  if(!lines.length){ body.innerHTML = `<tr><td colspan="4" class="empty">No BOM lines yet.</td></tr>`; return; }
  lines.forEach(l=>{
    const ing=findIng(l.ingredientId); const tr=document.createElement('tr');
    if(!ing){ tr.innerHTML=`<td>(deleted)</td><td class="num">${l.qty} ${l.unit}</td><td>—</td><td class="num">—</td>`; }
    else {
      const r2=lineCost(ing,l.qty,l.unit);
      const badge = !r2.ok?`<span class="pill err">${r2.reason}</span>`
        : r2.bridged?`<span class="pill bridge">via density</span>`
        : `<span class="pill ok">exact</span>`;
      tr.innerHTML = `<td><strong>${ing.name}</strong></td>
        <td class="num">${l.qty} ${UNITS[l.unit].label}</td>
        <td>${badge}</td>
        <td class="num"><strong>${r2.ok?money(r2.cost):'—'}</strong></td>`;
    }
    body.appendChild(tr);
  });
}

/* ---- PRICING ---- */
function renderPricing(c){
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Selling Price Calculator</h3><p class="sub">Suggested price = cost per portion ÷ target food-cost %. Change ingredient prices anywhere → this updates live.</p></div>
      </div>
      <table>
        <thead><tr><th>Recipe</th><th class="num">Cost/Portion</th><th class="num">Target FC%</th><th class="num">Suggested Price</th><th class="num">Margin</th></tr></thead>
        <tbody id="pb"></tbody>
      </table>
    </div>
  `;
  const body = document.getElementById('pb');
  if(!recipes.length){ body.innerHTML=`<tr><td colspan="5" class="empty">No recipes.</td></tr>`; return; }
  recipes.forEach(r=>{
    const cpp=costPerPortion(r), sp=suggestedPrice(r), m=sp>0?((sp-cpp)/sp*100):0;
    const tr=document.createElement('tr');
    tr.innerHTML = `<td><strong>${r.name}</strong></td>
      <td class="num">${money(cpp)}</td>
      <td class="num"><input type="number" value="${r.targetFoodCostPct}" data-fc="${r.id}" style="width:80px;text-align:right"></td>
      <td class="num"><strong>${money(sp)}</strong></td>
      <td class="num"><span class="pill ok">${m.toFixed(1)}%</span></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('[data-fc]').forEach(inp=> inp.onchange = async()=>{
    const r = recipes.find(x=>x.id===inp.dataset.fc);
    r.targetFoodCostPct = parseFloat(inp.value)||r.targetFoodCostPct;
    await saveAll(); render();
  });
}

/* ---- INVENTORY ---- */
function renderInventory(c){
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Inventory <span style="font-weight:400;color:var(--muted);font-size:13px;">(optional)</span></h3>
        <p class="sub">Stock on hand per ingredient. Flags "low" under 25% of one purchase batch.</p></div>
      </div>
      <table>
        <thead><tr><th>Ingredient</th><th class="num">Stock on hand</th><th>Status</th></tr></thead>
        <tbody id="ib"></tbody>
      </table>
    </div>
  `;
  const body = document.getElementById('ib');
  if(!ingredients.length){ body.innerHTML=`<tr><td colspan="3" class="empty">No ingredients.</td></tr>`; return; }
  ingredients.forEach(i=>{
    const s = inventory[i.id]??0; const low = s < i.purchaseQty*0.25;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><strong>${i.name}</strong></td>
      <td class="num"><input type="number" step="0.01" value="${s}" data-inv="${i.id}" style="width:100px;text-align:right"> ${UNITS[i.purchaseUnit].label}</td>
      <td><span class="pill ${low?'low':'ok'}">${low?'Low stock':'OK'}</span></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('[data-inv]').forEach(inp=> inp.onchange = async()=>{
    inventory[inp.dataset.inv] = parseFloat(inp.value)||0; await saveAll(); render();
  });
}

(async()=>{ await loadAll(); render(); })();
</script>
</body>
</html>
