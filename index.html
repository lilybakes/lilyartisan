<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SweetCost — Bakery Costing Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f9;
    --panel:#ffffff;
    --ink:#32334a;
    --ink-soft:#5a5b78;
    --muted:#a5a3b8;
    --line:#eceaf5;
    --accent:#7367f0;
    --accent-soft:#eeecff;
    --accent-dark:#5a4fd6;
    --success:#28c76f;
    --success-soft:#dff7e9;
    --warn:#ff9f43;
    --warn-soft:#fff1e0;
    --danger:#ea5455;
    --danger-soft:#fde3e4;
    --info:#00cfe8;
    --info-soft:#d9f6fa;
    --pink:#ff6b9d;
    --pink-soft:#ffe5ef;
    --font:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --radius:10px;
    --radius-lg:14px;
    --shadow:0 2px 6px rgba(50,51,74,0.06);
    --shadow-lg:0 6px 20px rgba(50,51,74,0.08);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }

  .app{ display:grid; grid-template-columns:260px 1fr; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  aside{
    background:var(--panel); border-right:1px solid var(--line);
    padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    display:flex; align-items:center; gap:11px; padding:0 10px 22px; margin-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .brand-logo{
    width:36px; height:36px; border-radius:10px;
    background:linear-gradient(135deg,#ff6b9d,#7367f0);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px;
    box-shadow:0 4px 12px rgba(115,103,240,0.35);
  }
  .brand-name{ font-weight:800; font-size:19px; letter-spacing:-0.4px; }
  .brand-name span{ color:var(--accent); }
  .nav-section{
    font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:0.7px; padding:16px 12px 8px;
  }
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:8px;
    color:var(--ink-soft); cursor:pointer; font-weight:500; font-size:13.5px;
    margin-bottom:3px; transition:all 0.15s; border:none; background:none; width:100%;
    text-align:left; font-family:inherit;
  }
  .nav-item:hover{ background:#f6f5fa; color:var(--ink); }
  .nav-item.active{
    background:linear-gradient(72deg,var(--accent) 0%, #8f83f5 100%);
    color:#fff; box-shadow:0 3px 10px rgba(115,103,240,0.35);
  }
  /* colored icon chip like Sneat/MacUI */
  .chip{
    width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:all 0.15s;
  }
  .chip svg{ width:15px; height:15px; }
  .nav-item .chip{ background:var(--accent-soft); color:var(--accent); }
  .nav-item[data-tab="ingredients"] .chip{ background:var(--info-soft); color:var(--info); }
  .nav-item[data-tab="recipes"] .chip{ background:var(--pink-soft); color:var(--pink); }
  .nav-item[data-tab="bomtab"] .chip{ background:var(--warn-soft); color:var(--warn); }
  .nav-item[data-tab="costing"] .chip{ background:var(--success-soft); color:var(--success); }
  .nav-item[data-tab="pricing"] .chip{ background:var(--accent-soft); color:var(--accent); }
  .nav-item[data-tab="inventory"] .chip{ background:var(--warn-soft); color:var(--warn); }
  .nav-item.active .chip{ background:rgba(255,255,255,0.22); color:#fff; }
  .nav-item.active .chip svg{ stroke:#fff; }
  .badge{
    margin-left:auto; font-size:10px; padding:2px 7px; border-radius:10px;
    background:var(--danger); color:#fff; font-weight:700;
  }
  .badge.soft{ background:var(--warn-soft); color:var(--warn); }

  /* ---------- Topbar ---------- */
  .topbar{
    background:var(--panel); border-radius:var(--radius-lg); margin:18px 28px 0;
    padding:10px 18px; display:flex; align-items:center; gap:14px;
    box-shadow:var(--shadow);
  }
  .search{ display:flex; align-items:center; gap:10px; flex:1; color:var(--muted); }
  .search input{ border:none; outline:none; background:none; font-family:inherit; font-size:14px; color:var(--ink); width:100%; }
  .top-icons{ display:flex; align-items:center; gap:6px; }
  .icn-btn{
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    border-radius:8px; color:var(--ink-soft); cursor:pointer; position:relative;
  }
  .icn-btn:hover{ background:#f6f5fa; }
  .dot{
    position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:50%;
    background:var(--danger); border:2px solid #fff;
  }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg,#ffb6c1,#ff9f43); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
    border:2px solid #fff; box-shadow:0 0 0 2px var(--success); margin-left:6px;
  }

  .content{ padding:22px 28px 60px; }

  /* ---------- Hero ---------- */
  .hero{
    background:var(--panel); border-radius:var(--radius-lg); padding:26px 28px;
    display:grid; grid-template-columns:1fr 220px; align-items:center; gap:20px;
    margin-bottom:20px; box-shadow:var(--shadow); overflow:hidden; position:relative;
  }
  .hero .greet{ color:var(--accent); font-weight:700; font-size:20px; margin:0 0 8px; letter-spacing:-0.3px; }
  .hero .greet span{ display:inline-block; animation:wave 1.6s ease-in-out infinite; transform-origin:70% 70%; }
  @keyframes wave{ 0%,60%,100%{transform:rotate(0)} 10%{transform:rotate(14deg)} 20%{transform:rotate(-8deg)} 30%{transform:rotate(14deg)} 40%{transform:rotate(-4deg)} 50%{transform:rotate(10deg)} }
  .hero p{ margin:0 0 14px; color:var(--ink-soft); font-size:13.5px; max-width:520px; }
  .hero .cta{
    display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
    padding:8px 18px; border-radius:8px; font-weight:600; font-size:13px;
    box-shadow:0 3px 10px rgba(115,103,240,0.32); cursor:pointer; border:none; font-family:inherit;
  }
  .hero-illus{ display:flex; align-items:center; justify-content:center; }

  /* ---------- Stat cards (bold pastel like Finance dashboard) ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:20px; }
  .stat-card{
    border-radius:var(--radius-lg); padding:20px 22px; color:#fff;
    position:relative; overflow:hidden; box-shadow:var(--shadow);
    min-height:130px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .stat-card .stat-icn{
    width:44px; height:44px; border-radius:10px; background:rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center; margin-bottom:10px;
  }
  .stat-card .stat-icn svg{ width:22px; height:22px; stroke:#fff; }
  .stat-card .lbl{ font-size:13px; font-weight:500; opacity:0.9; }
  .stat-card .val{ font-size:26px; font-weight:800; letter-spacing:-0.5px; margin-top:2px; }
  .stat-card .delta{ font-size:11.5px; opacity:0.88; margin-top:6px; font-weight:500; }
  .stat-1{ background:linear-gradient(135deg,#7367f0,#9d94f5); }
  .stat-2{ background:linear-gradient(135deg,#00cfe8,#4ddbec); }
  .stat-3{ background:linear-gradient(135deg,#ff9f43,#ffb976); }
  .stat-4{ background:linear-gradient(135deg,#28c76f,#5fd694); }
  .stat-card::after{
    content:''; position:absolute; right:-30px; top:-30px; width:120px; height:120px;
    border-radius:50%; background:rgba(255,255,255,0.09);
  }
  .stat-card::before{
    content:''; position:absolute; right:20px; bottom:-40px; width:80px; height:80px;
    border-radius:50%; background:rgba(255,255,255,0.07);
  }

  /* Grid for dashboard */
  .dash-grid{ display:grid; grid-template-columns:2fr 1fr; gap:20px; }
  @media(max-width:1100px){ .dash-grid{ grid-template-columns:1fr; } }

  /* ---------- Panel ---------- */
  .panel{
    background:var(--panel); border-radius:var(--radius-lg); padding:22px 24px;
    box-shadow:var(--shadow); margin-bottom:20px;
  }
  .panel-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:16px; gap:12px; flex-wrap:wrap;
  }
  .panel h3{ margin:0; font-size:16px; font-weight:700; letter-spacing:-0.2px; }
  .panel .sub{ margin:3px 0 0; color:var(--muted); font-size:12.5px; }
  .panel-head .menu{ color:var(--muted); cursor:pointer; padding:4px; font-size:18px; }

  /* ---------- Table ---------- */
  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:11px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.5px; padding:11px 12px;
    border-bottom:1px solid var(--line); background:#fafaff;
  }
  th:first-child{ border-top-left-radius:8px; padding-left:14px; }
  th:last-child{ border-top-right-radius:8px; padding-right:14px; }
  td{ padding:14px 12px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  td:first-child{ padding-left:14px; }
  td:last-child{ padding-right:14px; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:#fafaff; }
  .num{ text-align:right; font-variant-numeric:tabular-nums; font-weight:500; }
  .row-name{ display:flex; align-items:center; gap:10px; }
  .row-chip{
    width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; color:#fff; flex-shrink:0;
  }

  /* ---------- Inputs ---------- */
  input, select{
    font-family:inherit; font-size:13.5px; padding:9px 12px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--ink); width:100%; transition:all 0.15s;
  }
  input:focus, select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(115,103,240,0.12); }
  .row-add{
    display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:flex-end;
    padding-top:16px; border-top:1px dashed var(--line);
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; }

  /* ---------- Buttons ---------- */
  button.primary{
    background:var(--accent); color:#fff; border:none; padding:9px 18px; border-radius:8px;
    cursor:pointer; font-size:13.5px; font-weight:600; font-family:inherit;
    box-shadow:0 3px 8px rgba(115,103,240,0.28); transition:all 0.15s;
  }
  button.primary:hover{ background:var(--accent-dark); }
  button.primary:active{ transform:translateY(1px); }
  button.ghost{
    background:none; border:1px solid var(--line); color:var(--ink-soft); padding:6px 12px;
    border-radius:6px; cursor:pointer; font-size:12px; font-weight:500; font-family:inherit;
  }
  button.ghost:hover{ border-color:var(--danger); color:var(--danger); background:var(--danger-soft); }

  /* ---------- Pills ---------- */
  .pill{ display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
  .pill.ok{ background:var(--success-soft); color:var(--success); }
  .pill.low{ background:var(--warn-soft); color:var(--warn); }
  .pill.bridge{ background:var(--accent-soft); color:var(--accent); }
  .pill.err{ background:var(--danger-soft); color:var(--danger); }
  .pill.info{ background:var(--info-soft); color:var(--info); }

  .empty{ color:var(--muted); font-style:italic; padding:24px 4px; text-align:center; }

  /* ---------- BOM ---------- */
  .bom-line{
    display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:12px; align-items:center;
    padding:12px 14px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px;
    background:#fff; transition:all 0.15s;
  }
  .bom-line:hover{ border-color:#dedafc; background:#fafaff; }
  .recipe-select{ margin-bottom:18px; max-width:380px; }

  /* ---------- Info box ---------- */
  .conv-box{
    background:linear-gradient(135deg,#f4f2ff,#eeecff); border:1px solid #dedafc;
    border-radius:10px; padding:14px 16px; font-size:12.5px; color:var(--ink-soft);
    margin-bottom:18px; display:flex; gap:12px; align-items:flex-start;
  }
  .conv-box b{ color:var(--accent-dark); }
  .conv-icon{
    width:32px; height:32px; border-radius:8px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  /* ---------- Metric cards on costing page ---------- */
  .metric-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:20px; }
  .metric{
    background:var(--panel); border-radius:var(--radius-lg); padding:20px 22px;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:14px;
  }
  .metric .m-icn{
    width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .metric.a .m-icn{ background:var(--accent-soft); color:var(--accent); }
  .metric.b .m-icn{ background:var(--info-soft); color:var(--info); }
  .metric.c .m-icn{ background:var(--success-soft); color:var(--success); }
  .metric .l{ font-size:12px; color:var(--muted); font-weight:500; }
  .metric .v{ font-size:22px; font-weight:800; margin-top:2px; letter-spacing:-0.4px; }

  /* ---------- Chart (svg bar) ---------- */
  .chart-wrap{ padding:8px 0 0; }
  .chart-row{ display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:12.5px; }
  .chart-row .name{ width:130px; color:var(--ink-soft); font-weight:500; }
  .chart-row .bar-bg{ flex:1; height:8px; background:#f0eef8; border-radius:4px; overflow:hidden; }
  .chart-row .bar-fill{ height:100%; border-radius:4px; }
  .chart-row .val{ width:80px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; color:var(--ink); }

  /* ---------- Radial progress ---------- */
  .radial{
    display:flex; flex-direction:column; align-items:center; padding:8px 0 6px;
  }
  .radial svg{ width:140px; height:140px; }
  .radial .r-val{ font-size:24px; font-weight:800; letter-spacing:-0.4px; margin-top:-90px; }
  .radial .r-lbl{ font-size:12px; color:var(--muted); margin-top:80px; }

  /* Responsive */
  @media(max-width:960px){
    .app{ grid-template-columns:1fr; }
    aside{ display:none; }
    .stat-row{ grid-template-columns:repeat(2,1fr); }
    .hero{ grid-template-columns:1fr; }
    .hero-illus{ display:none; }
    .metric-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand">
      <div class="brand-logo">🎂</div>
      <div class="brand-name">Sweet<span>Cost</span></div>
    </div>
    <div class="nav-section">Main</div>
    <div id="nav"></div>
    <div class="nav-section">Data</div>
    <button class="nav-item"><span class="chip" style="background:var(--info-soft);color:var(--info)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </span> Import CSV</button>
    <button class="nav-item"><span class="chip" style="background:var(--pink-soft);color:var(--pink)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </span> Export</button>
    <div class="nav-section">Support</div>
    <button class="nav-item"><span class="chip" style="background:var(--warn-soft);color:var(--warn)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </span> Help <span class="badge soft">NEW</span></button>
    <button class="nav-item"><span class="chip" style="background:#f0eef8;color:var(--ink-soft)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </span> Settings</button>
  </aside>

  <main>
    <div class="topbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input placeholder="Search recipes, ingredients…">
      </div>
      <div class="top-icons">
        <div class="icn-btn" title="Language">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <div class="icn-btn" title="Apps">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </div>
        <div class="icn-btn" title="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="dot"></span>
        </div>
        <div class="avatar">A</div>
      </div>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* ============== ICONS ============== */
const ICONS = {
  ingredients:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M4.93 4.93l2.83 2.83M2 12h4M4.93 19.07l2.83-2.83M12 22v-4M19.07 19.07l-2.83-2.83M22 12h-4M19.07 4.93l-2.83 2.83"/><circle cx="12" cy="12" r="4"/></svg>',
  recipes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>',
  bom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',

  async set(k,v){ if(window.storage){ try{ await window.storage.set(k,v,false); return; }catch(e){} } mem[k]=v; }
};

/* ============== UNITS ============== */
const UNITS = {
  g:{dim:'mass',toBase:1,label:'g'}, kg:{dim:'mass',toBase:1000,label:'kg'},
  oz:{dim:'mass',toBase:28.3495,label:'oz'}, lb:{dim:'mass',toBase:453.592,label:'lb'},
  ml:{dim:'volume',toBase:1,label:'ml'}, l:{dim:'volume',toBase:1000,label:'L'},
  tsp:{dim:'volume',toBase:4.92892,label:'tsp'}, tbsp:{dim:'volume',toBase:14.7868,label:'tbsp'},
  cup:{dim:'volume',toBase:236.588,label:'cup'}, pcs:{dim:'count',toBase:1,label:'pcs'},
};
function convert(qty,from,to,density){
  const f=UNITS[from], t=UNITS[to]; if(!f||!t) return {ok:false};
  if(f.dim===t.dim) return {ok:true, value:qty*f.toBase/t.toBase, bridged:false};
  const mv = (f.dim==='mass'&&t.dim==='volume')||(f.dim==='volume'&&t.dim==='mass');
  if(mv && density){
    let g = f.dim==='mass' ? qty*f.toBase : qty*f.toBase*density;
    if(t.dim==='mass') return {ok:true, value:g/t.toBase, bridged:true};
    return {ok:true, value:(g/density)/t.toBase, bridged:true};
  }
  return {ok:false, reason:'needs density'};
}

/* ============== CALC ============== */
const findIng = id => ingredients.find(i=>i.id===id);
function unitCostBase(ing){
  const u=UNITS[ing.purchaseUnit]; if(!u) return 0;
  const q = ing.purchaseQty*u.toBase*(1-(ing.wastePct||0)/100);
  return q>0 ? ing.purchasePrice/q : 0;
}
function lineCost(ing,qty,unit){
  const pu=UNITS[ing.purchaseUnit], uu=UNITS[unit]; if(!pu||!uu) return {ok:false,reason:'unknown unit'};
  const base=unitCostBase(ing);
  if(pu.dim===uu.dim) return {ok:true, cost:qty*uu.toBase*base, bridged:false};
  const c=convert(qty,unit,ing.purchaseUnit,ing.density);
  if(!c.ok) return {ok:false, reason:c.reason||'no conversion'};
  return {ok:true, cost:c.value*pu.toBase*base, bridged:c.bridged};
}
function recipeCostTotal(rid){
  return (bom[rid]||[]).reduce((s,l)=>{ const i=findIng(l.ingredientId); if(!i) return s; const r=lineCost(i,l.qty,l.unit); return s+(r.ok?r.cost:0); },0);
}
function costPerPortion(r){ const t=recipeCostTotal(r.id); return r.yieldPortions>0?t/r.yieldPortions:0; }
function suggestedPrice(r){ const cpp=costPerPortion(r); const p=(r.targetFoodCostPct||28)/100; return p>0?cpp/p:0; }
const money = n => 'RM ' + (isFinite(n)?n:0).toFixed(2);
const uid = p => p + Math.random().toString(36).slice(2,8);
const initials = s => s.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

function renderBom(c){
  if(!recipes.length){ c.innerHTML=`<div class="panel"><p class="empty">Add a recipe first in Recipe Master.</p></div>`; return; }
  if(!bomActive||!recipes.find(r=>r.id===bomActive)) bomActive=recipes[0].id;

  c.innerHTML = `
    <div class="recipe-select">
      <select id="rp">${recipes.map(r=>`<option value="${r.id}" ${r.id===bomActive?'selected':''}>${r.name}</option>`).join('')}</select>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h3>Recipe BOM</h3><p class="sub">Use whatever unit the recipe is written in — conversion happens against the ingredient's purchase unit.</p></div>
      </div>
      <div class="conv-box">
        <div class="conv-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg>
        </div>
        <div>
          <b>Conversion rules:</b> g ↔ kg, oz ↔ lb, ml ↔ L ↔ tsp/tbsp/cup convert exactly.
          Crossing mass ↔ volume (e.g. <b>cups of butter</b> against a <b>kg</b> purchase) uses each ingredient's density. Missing density is flagged, not silently guessed.
        </div>
      </div>
      <div id="bom-lines"></div>
      <div class="bom-line" style="margin-top:14px; background:#fafaff; border-style:dashed;">
        <select id="bi"></select>
        <input id="bq" type="number" step="0.01" placeholder="qty">
        <select id="bu">${unitOptions('g')}</select>
        <div></div>
        <button class="primary" id="ba">+ Add</button>
      </div>
    </div>
  `;
  document.getElementById('rp').onchange = e=>{ bomActive=e.target.value; render(); };
  const lines = bom[bomActive] || (bom[bomActive]=[]);
  const wrap = document.getElementById('bom-lines');
  if(!lines.length){ wrap.innerHTML = `<p class="empty">No ingredients linked yet.</p>`; }
  lines.forEach((l,idx)=>{
    const ing = findIng(l.ingredientId);
    const d = document.createElement('div'); d.className='bom-line';
    if(!ing){ d.innerHTML = `<div>(deleted)</div><div></div><div></div><div></div><button class="ghost" data-idx="${idx}">Remove</button>`; }
    else {
      const r = lineCost(ing,l.qty,l.unit);
      const badge = !r.ok?`<span class="pill err">no conversion</span>`
        : r.bridged?`<span class="pill bridge">via density</span>`
        : `<span class="pill ok">direct</span>`;
      d.innerHTML = `
        <div class="row-name"><div class="row-chip" style="background:${ing.color||'#7367f0'};width:28px;height:28px;font-size:11px">${initials(ing.name)}</div><strong>${ing.name}</strong></div>
        <div class="num">${l.qty} ${UNITS[l.unit].label}</div>
        <div>${badge}</div>
        <div class="num"><strong>${r.ok?money(r.cost):'—'}</strong></div>
        <button class="ghost" data-idx="${idx}">Remove</button>
      `;
    }
    wrap.appendChild(d);
  });
  wrap.querySelectorAll('[data-idx]').forEach(b=> b.onclick=async()=>{
    lines.splice(parseInt(b.dataset.idx),1); await saveAll(); render();
  });
  const sel = document.getElementById('bi');
  sel.innerHTML = ingredients.map(i=>`<option value="${i.id}">${i.name}</option>`).join('');
  document.getElementById('ba').onclick = async()=>{
    const iid=sel.value, q=parseFloat(document.getElementById('bq').value), u=document.getElementById('bu').value;
    if(!iid||!q){ alert('Pick ingredient and enter qty.'); return; }
    lines.push({ingredientId:iid,qty:q,unit:u}); await saveAll(); render();
  };
}

/* ---------- COSTING ---------- */
let costActive=null;
function renderCosting(c){
  if(!recipes.length){ c.innerHTML=`<div class="panel"><p class="empty">Add a recipe first.</p></div>`; return; }
  if(!costActive||!recipes.find(r=>r.id===costActive)) costActive=recipes[0].id;
  const r = recipes.find(x=>x.id===costActive);
  const lines = bom[r.id]||[];
  const total = recipeCostTotal(r.id);
  const cpp = costPerPortion(r);
  const sp = suggestedPrice(r);

  c.innerHTML = `
    <div class="recipe-select">
      <select id="rp">${recipes.map(x=>`<option value="${x.id}" ${x.id===costActive?'selected':''}>${x.name}</option>`).join('')}</select>
    </div>
    <div class="metric-row">
      <div class="metric a">
        <div class="m-icn">${ICONS.costing}</div>
        <div><div class="l">Total Batch Cost</div><div class="v">${money(total)}</div></div>
      </div>
      <div class="metric b">
        <div class="m-icn">${ICONS.inventory}</div>
        <div><div class="l">Portions per Batch</div><div class="v">${r.yieldPortions}</div></div>
      </div>
      <div class="metric c">
        <div class="m-icn">${ICONS.pricing}</div>
        <div><div class="l">Cost per Portion</div><div class="v">${money(cpp)}</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h3>Cost Breakdown</h3><p class="sub">${r.name} — suggested price <strong>${money(sp)}</strong> at ${r.targetFoodCostPct}% target food cost</p></div>
      </div>
      <table>
        <thead><tr><th>Ingredient</th><th class="num">Qty used</th><th>Conversion</th><th class="num">Line cost</th></tr></thead>
        <tbody id="cb"></tbody>
      </table>
    </div>
  `;
  document.getElementById('rp').onchange = e=>{ costActive=e.target.value; render(); };
  const body = document.getElementById('cb');
  if(!lines.length){ body.innerHTML = `<tr><td colspan="4" class="empty">No BOM lines yet.</td></tr>`; return; }
  lines.forEach(l=>{
    const ing=findIng(l.ingredientId); const tr=document.createElement('tr');
    if(!ing){ tr.innerHTML=`<td>(deleted)</td><td class="num">${l.qty} ${l.unit}</td><td>—</td><td class="num">—</td>`; }
    else {
      const r2=lineCost(ing,l.qty,l.unit);
      const badge = !r2.ok?`<span class="pill err">${r2.reason}</span>`
        : r2.bridged?`<span class="pill bridge">via density</span>`
        : `<span class="pill ok">exact</span>`;
      tr.innerHTML = `<td><div class="row-name"><div class="row-chip" style="background:${ing.color||'#7367f0'}">${initials(ing.name)}</div><strong>${ing.name}</strong></div></td>
        <td class="num">${l.qty} ${UNITS[l.unit].label}</td>
        <td>${badge}</td>
        <td class="num"><strong>${r2.ok?money(r2.cost):'—'}</strong></td>`;
    }
    body.appendChild(tr);
  });
}

/* ---------- PRICING ---------- */
function renderPricing(c){
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Selling Price Calculator</h3><p class="sub">Suggested price = cost per portion ÷ target food-cost %. Change ingredient prices anywhere → this updates live.</p></div>
      </div>
      <table>
        <thead><tr><th>Recipe</th><th class="num">Cost/Portion</th><th class="num">Target FC%</th><th class="num">Suggested Price</th><th class="num">Margin</th></tr></thead>
        <tbody id="pb"></tbody>
      </table>
    </div>
  `;
  const body = document.getElementById('pb');
  if(!recipes.length){ body.innerHTML=`<tr><td colspan="5" class="empty">No recipes.</td></tr>`; return; }
  recipes.forEach((r,idx)=>{
    const cpp=costPerPortion(r), sp=suggestedPrice(r), m=sp>0?((sp-cpp)/sp*100):0;
    const color = ['#7367f0','#ff9f43','#28c76f','#ff6b9d','#00cfe8'][idx % 5];
    const tr=document.createElement('tr');
    tr.innerHTML = `<td><div class="row-name"><div class="row-chip" style="background:${color}">${initials(r.name)}</div><strong>${r.name}</strong></div></td>
      <td class="num">${money(cpp)}</td>
      <td class="num"><input type="number" value="${r.targetFoodCostPct}" data-fc="${r.id}" style="width:80px;text-align:right"></td>
      <td class="num"><strong>${money(sp)}</strong></td>
      <td class="num"><span class="pill ok">${m.toFixed(1)}%</span></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('[data-fc]').forEach(inp=> inp.onchange = async()=>{
    const r = recipes.find(x=>x.id===inp.dataset.fc);
    r.targetFoodCostPct = parseFloat(inp.value)||r.targetFoodCostPct;
    await saveAll(); render();
  });
}

/* ---------- INVENTORY ---------- */
function renderInventory(c){
  c.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div><h3>Inventory <span style="font-weight:400;color:var(--muted);font-size:13px;">(optional)</span></h3>
        <p class="sub">Stock on hand per ingredient. Flags "low" under 25% of one purchase batch.</p></div>
      </div>
      <table>
        <thead><tr><th>Ingredient</th><th class="num">Stock on hand</th><th>Status</th></tr></thead>
        <tbody id="ib"></tbody>
      </table>
    </div>
  `;
  const body = document.getElementById('ib');
  if(!ingredients.length){ body.innerHTML=`<tr><td colspan="3" class="empty">No ingredients.</td></tr>`; return; }
  ingredients.forEach(i=>{
    const s = inventory[i.id]??0; const low = s < i.purchaseQty*0.25;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><div class="row-name"><div class="row-chip" style="background:${i.color||'#7367f0'}">${initials(i.name)}</div><strong>${i.name}</strong></div></td>
      <td class="num"><input type="number" step="0.01" value="${s}" data-inv="${i.id}" style="width:100px;text-align:right"> ${UNITS[i.purchaseUnit].label}</td>
      <td><span class="pill ${low?'low':'ok'}">${low?'Low stock':'OK'}</span></td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll('[data-inv]').forEach(inp=> inp.onchange = async()=>{
    inventory[inp.dataset.inv] = parseFloat(inp.value)||0; await saveAll(); render();
  });
}

(async()=>{ await loadAll(); render(); })();
</script>
</body>
</html>
